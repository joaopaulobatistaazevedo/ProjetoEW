services:
  api-dados:
    build: ./api-dados
    ports:
      - "3001:3001"
    environment:
      - MONGO_URL=mongodb://mongodb_api:27017/recursos_educativos
      - JWT_SECRET=jcr_secret_2026
      - COOKIE_NAME=token
      - INTERFACE_URL=http://interface:3000
    depends_on:
      - mongodb_api
    networks:
      - app-network

  auth:
    build: ./auth
    ports:
      - "3002:2623"
    environment:
      - MONGO_URL=mongodb://mongodb_api:27017/recursos_educativos
      - PORT=2623
      - JWT_SECRET=jcr_secret_2026
      - COOKIE_NAME=token
      - SWAGGER_URL=http://localhost:3002
      - INTERFACE_URL=http://interface:3000
    depends_on:
      - mongodb_api
    networks:
      - app-network

  interface:
    build: ./interface
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - API_URL=http://api-dados:3001
      - AUTH_URL=http://auth:2623/users
      - COOKIE_NAME=token
      - JWT_SECRET=jcr_secret_2026
    depends_on:
      - api-dados
      - auth
    networks:
      - app-network

  mongodb_api:
    build:
      context: ./api-dados
      dockerfile: Dockerfile.mongo
    ports:
      - "27018:27017"
    volumes:
      - mongodb_api_data:/data/db
      - ./api-dados/mongo_init:/docker-entrypoint-initdb.d
    networks:
      - app-network

volumes:
  mongodb_api_data:

networks:
  app-network:
    driver: bridge
