services:

  mongodb:
    image: mongo:7
    container_name: mongodb_projetoew
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: recursos_educativos
    volumes:
      - mongo_data:/data/db
      - ./mongo_init:/docker-entrypoint-initdb.d
    networks:
      - projetoew-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: api_projetoew
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      - MONGO_URL=mongodb://mongodb:27017/recursos_educativos
    volumes:
      - uploads:/app/uploads
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - projetoew-network

  interface:
    build:
      context: ./interface
      dockerfile: Dockerfile.interface
    container_name: interface_projetoew
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file: .env
    environment:
      - API_URL=http://api_projetoew:3000
    depends_on:
      - api
    networks:
      - projetoew-network

networks:
  projetoew-network:
    driver: bridge

volumes:
  mongo_data:
  uploads: